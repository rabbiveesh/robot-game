[package]
name = "robot-buddy-game"
version = "0.1.0"
edition = "2021"

[dependencies]
robot-buddy-domain = { path = "../robot-buddy-domain" }
# 2D + UI + picking only: no 3D, no audio, no gltf. Bevy UI is taffy flexbox,
# picking does hit-testing (mouse and touch), so neither is hand-rolled here.
bevy = { version = "=0.19.1", default-features = false, features = [
    "default_app", "std", "multi_threaded",
    "bevy_winit", "x11", "webgl2",
    "2d_bevy_render", "ui_api", "ui_bevy_render",
    "bevy_picking", "ui_picking",
] }
# Immediate-mode vector shapes: the sprites and tiles are drawn from
# primitives every frame, exactly as they were under macroquad.
bevy_vector_shapes = { version = "=0.13.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rand = { version = "0.8", default-features = false, features = ["small_rng"] }
# Headless text metrics for world-space text (centering a label over a pad)
# without a GPU: the same bundled font Bevy renders with.
fontdue = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser APIs (localStorage, speech, downloads, tab visibility) straight
# from Rust — no hand-written JS plugins.
web-sys = { version = "0.3", features = [
    "Window", "Document", "Storage", "VisibilityState",
    "SpeechSynthesis", "SpeechSynthesisUtterance",
    "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlElement", "Element",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"
# rand 0.8 is built without getrandom here, but Bevy's deps need a browser
# entropy source on wasm32.
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
# PNG encoding for examples/screenshots.rs, kept out of the shipped WASM:
#   cargo run -p robot-buddy-game --example screenshots --features screenshots
screenshots = ["bevy/png"]

[[example]]
name = "screenshots"
required-features = ["screenshots"]

[dev-dependencies]
robot-buddy-domain = { path = "../robot-buddy-domain" }
# Font-coverage test: parse the bundled font's cmap (ttf-parser) and walk the
# source for rendered string/char literals (syn).
ttf-parser = "0.21"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
