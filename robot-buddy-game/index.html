<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Buddy Adventure</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
        canvas { width: 100vw; height: 100vh; display: block; outline: none; touch-action: none; }
        #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                   color: #90caf9; font: 24px sans-serif; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="bevy" tabindex="0"></canvas>
    <div id="loading">Waking up Sparky…</div>
    <script type="module">
        // WebGL2 preflight: without it the game can't start, so say why
        // instead of showing a black canvas.
        if (!document.createElement("canvas").getContext("webgl2")) {
            document.body.innerHTML =
                '<div style="color:#eee;font-family:sans-serif;max-width:34em;margin:4em auto;line-height:1.5">' +
                '<h1>Robot Buddy needs WebGL2</h1>' +
                '<p>Your browser could not create a WebGL2 context, so the game cannot start.</p>' +
                '<p>Usually this means graphics acceleration is off or unavailable. Try:</p>' +
                '<ul style="padding-left:1.5em">' +
                '<li>Chrome: check <code>chrome://gpu</code>, enable "Use graphics acceleration" in settings, or enable <code>chrome://flags/#enable-unsafe-swiftshader</code></li>' +
                '<li>Or open this page in Firefox</li>' +
                '</ul></div>';
        } else {
            const canvas = document.getElementById("bevy");
            canvas.focus();
            document.addEventListener("click", () => canvas.focus());
            import("./robot-buddy-game.js")
                .then((m) => m.default())
                .catch((e) => {
                    // Bevy's winit loop exits by throwing a control-flow
                    // "exception" that isn't an error.
                    if (!String(e).includes("Using exceptions for control flow")) throw e;
                });
            // Hide the loading line once the game has drawn a frame.
            const hide = () => document.getElementById("loading")?.remove();
            new MutationObserver(hide).observe(canvas, { attributes: true });
        }
    </script>
</body>
</html>
