[package]
name = "spike-bevy"
version = "0.1.0"
edition = "2021"

# Standalone: not a member of the root workspace, so it can't break `cargo test`.
[workspace]

[dependencies]
robot-buddy-domain = { path = "../robot-buddy-domain" }
bevy = { version = "=0.19.1", default-features = false, features = ["2d", "ui", "default_font", "png", "x11", "webgl2"] }

[profile.dev.package."*"]
opt-level = 2
