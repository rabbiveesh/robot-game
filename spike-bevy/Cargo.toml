[package]
name = "spike-bevy"
version = "0.1.0"
edition = "2021"

# Standalone: not a member of the root workspace, so it can't break `cargo test`.
[workspace]

[dependencies]
robot-buddy-domain = { path = "../robot-buddy-domain" }
bevy = { version = "=0.19.1", default-features = false, features = ["default_app", "std", "multi_threaded", "bevy_winit", "x11", "webgl2", "2d_bevy_render", "ui_api", "ui_bevy_render", "bevy_picking", "ui_picking", "png"] }
bevy_vector_shapes = { version = "=0.13.1", default-features = false }
rand = { version = "0.8", default-features = false, features = ["small_rng"] }

[profile.dev.package."*"]
opt-level = 2

# Same release profile as the game workspace, so WASM sizes compare fairly.
[profile.release]
opt-level = "s"
lto = true

# Smallest WASM we can get without touching code.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"
