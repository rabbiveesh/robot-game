[workspace]
members = ["robot-buddy-domain", "robot-buddy-game"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true

# Smallest WASM without touching code: build-wasm.sh uses this profile.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"

# Bevy is big; optimize dependencies even in dev so the game runs at speed.
[profile.dev.package."*"]
opt-level = 2
# Dependency debuginfo is gigabytes for Bevy and rarely useful.
debug = false
