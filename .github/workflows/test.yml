name: Tests

on:
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Bevy's cold build is long; cache compiled dependencies between runs.
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --profile wasm-release -p robot-buddy-game
