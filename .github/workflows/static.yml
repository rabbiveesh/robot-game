# Deploy the playable game to GitHub Pages
# Bevy WASM build (cargo + wasm-bindgen + wasm-opt) — no Node, no npm
name: Deploy game to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Bevy's cold build is long; cache compiled dependencies between runs.
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli (matching Cargo.lock) and wasm-opt
        run: |
          WANT=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          curl -sSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WANT}/wasm-bindgen-${WANT}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin "wasm-bindgen-${WANT}-x86_64-unknown-linux-musl/wasm-bindgen"
          sudo apt-get update && sudo apt-get install -y binaryen

      - name: Run tests
        run: cargo test

      - name: Build WASM and assemble www/
        run: ./build-wasm.sh

      - name: Prepare deploy directory
        run: |
          mkdir -p _site
          cp robot-buddy-game/www/index.html _site/
          cp robot-buddy-game/www/robot-buddy-game.js _site/
          cp robot-buddy-game/www/robot-buddy-game_bg.wasm _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
